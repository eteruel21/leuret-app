name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Codebase & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: "ci_jwt_secret_key_at_least_43_characters_long_for_testing_purposes"
      VITE_API_URL: https://api.leurettech.com
      EXPO_PUBLIC_API_URL: https://api.leurettech.com
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      VITE_TURNSTILE_CHALLENGE_URL: /turnstile.html
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL: https://app.leurettech.com/turnstile

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 3. Install dependencies
        run: |
          npm ci || npm install
          npm install @rollup/rollup-linux-x64-gnu -w apps/admin-web --no-save

      - name: 4. Typecheck all workspaces
        run: npm run typecheck

      - name: 5. Test database migration tooling
        run: npm run test:database-unit

      - name: 6. Smoke test API Worker runtime
        run: npm run test:worker-runtime -w apps/api

      # Arranca el Worker real en workerd (runtime de Cloudflare). La prueba
      # anterior corre en Node y no detecta incompatibilidades de Workers.
      - name: 6b. Boot API Worker in workerd (Cloudflare runtime)
        run: npm run test:workerd -w apps/api

      - name: 7. Run non-destructive API tests
        env:
          DATABASE_MODE: hyperdrive
        # Corre todos los tests de la API salvo los que necesitan la base
        # aislada (TEST_DATABASE_URL); esos se ejecutan en el paso 10.
        # Así un test nuevo entra al CI sin agregarlo a una lista.
        run: |
          npm --workspace apps/api run test -- \
            --exclude src/auth/__tests__/auth.test.ts \
            --exclude src/auth/__tests__/authorization_rls.test.ts \
            --exclude src/admin/__tests__/admin-session-revocation.test.ts \
            --exclude src/admin/__tests__/admin-support-actions.test.ts \
            --exclude src/admin/__tests__/admin-price-contributions.test.ts \
            --exclude src/db/__tests__/with-user-transaction.test.ts \
            --exclude src/budgets/__tests__/budgets.test.ts \
            --exclude src/invoices/__tests__/document_numbering.test.ts \
            --exclude src/client-portal/__tests__/client-portal.test.ts \
            --exclude src/client-connections/__tests__/client-connections.test.ts

      - name: 8. Prepare isolated authorization database
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DATABASE_NAME: test_leuret
          CONTRACTOR_MIGRATOR_PASSWORD: ci_migrator_password
          CONTRACTOR_API_PASSWORD: ci_api_password
          # La migración histórica 024 no selecciona contractor_owner; la base
          # efímera usa postgres solo para reproducir el esquema completo.
          MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_leuret
        run: |
          node database/scripts/bootstrap.mjs
          node database/scripts/migrate.mjs

      - name: 9. Verify isolated backup and restore
        run: |
          docker exec -i \
            -e PGUSER=postgres \
            -e BACKUP_TEST_SOURCE_DATABASE=test_leuret \
            -e BACKUP_TEST_RESTORE_DATABASE=test_leuret_restore \
            "${{ job.services.postgres.id }}" \
            sh < database/scripts/verify-backup-restore.sh

      - name: 10. Test authentication and cross-company isolation
        env:
          DATABASE_MODE: postgres
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_leuret
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: test_leuret
          PGUSER: contractor_api
          PGPASSWORD: ci_api_password
          PGSSL: disable
        run: |
          npm --workspace apps/api run test -- \
            src/auth/__tests__/auth.test.ts \
            src/auth/__tests__/authorization_rls.test.ts \
            src/admin/__tests__/admin-session-revocation.test.ts \
            src/admin/__tests__/admin-support-actions.test.ts \
            src/admin/__tests__/admin-price-contributions.test.ts \
            src/db/__tests__/with-user-transaction.test.ts \
            src/budgets/__tests__/budgets.test.ts \
            src/invoices/__tests__/document_numbering.test.ts \
            src/client-portal/__tests__/client-portal.test.ts \
            src/client-connections/__tests__/client-connections.test.ts

      - name: 11. Test mobile app
        run: npm run test -w apps/mobile

      - name: 12. Build API backend
        run: npm run build:api

      - name: 13. Build admin web application
        run: npm run build:admin

      - name: 14. Build mobile web application
        run: npm run build:mobile

      - name: 15. Verify production client configuration
        run: |
          test -n "$VITE_API_URL"
          test -n "$EXPO_PUBLIC_API_URL"
          test -n "$VITE_TURNSTILE_SITE_KEY"
          test -n "$EXPO_PUBLIC_TURNSTILE_SITE_KEY"

          grep -R -F "$VITE_API_URL" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_API_URL" apps/mobile/dist > /dev/null
          grep -R -F "$VITE_TURNSTILE_SITE_KEY" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_TURNSTILE_SITE_KEY" apps/mobile/dist > /dev/null

          if grep -R -F "https://api.contractor.com.pa" apps/admin-web/dist apps/mobile/dist; then
            echo "Legacy production API fallback found in client bundles."
            exit 1
          fi
