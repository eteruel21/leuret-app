name: Validate

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    name: Validate Codebase & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_key_at_least_43_characters_long_for_testing_purposes
      VITE_API_URL: http://127.0.0.1:3001
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3001
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      VITE_TURNSTILE_CHALLENGE_URL: /turnstile
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL: http://127.0.0.1:8081/turnstile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          install -d "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint/release.tar.gz"
          printf '%s  %s\n' '900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a' \
            "$RUNNER_TEMP/actionlint/release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/release.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify CI and deployment safeguards
        run: node --test scripts/ci-workflow-contract.test.mjs scripts/monitor-production.test.mjs

      - name: Block new high and critical advisories in deployed dependencies
        if: github.event_name != 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          baseline=$(mktemp -d)
          git archive "$BASE_SHA" package.json package-lock.json \
            apps/api/package.json apps/admin-web/package.json apps/mobile/package.json | tar -x -C "$baseline"
          (cd "$baseline" && npm audit --omit=dev --package-lock-only --audit-level=none --json) > "$baseline/base.json"
          npm audit --omit=dev --package-lock-only --audit-level=none --json > "$baseline/head.json"
          node scripts/check-dependency-advisories.mjs "$baseline/base.json" "$baseline/head.json"

      - name: Check types and generated legal documents
        run: |
          npm run typecheck
          npm run legal:check

      - name: Test API logic and security
        run: npm run test:unit -w apps/api

      - name: Smoke test API Worker runtime in Node and workerd
        run: |
          npm run test:worker-runtime -w apps/api
          npm run test:workerd -w apps/api

      - name: Prepare and lint isolated PostgreSQL database
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DATABASE_NAME: test_leuret
          CONTRACTOR_MIGRATOR_PASSWORD: ci_migrator_password
          CONTRACTOR_API_PASSWORD: ci_api_password
          # La migración histórica 024 necesita postgres en el entorno descartable.
          MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_leuret
        run: |
          node database/scripts/bootstrap.mjs
          node database/scripts/migrate.mjs
          node database/scripts/schema-lint.mjs

      - name: Verify isolated backup and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i \
            -e PGUSER=postgres \
            -e BACKUP_TEST_SOURCE_DATABASE=test_leuret \
            -e BACKUP_TEST_RESTORE_DATABASE=test_leuret_restore \
            "$POSTGRES_CONTAINER" sh < database/scripts/verify-backup-restore.sh

      - name: Test migration history, database constraints and invoice lifecycle
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CONTRACTOR_MIGRATOR_PASSWORD: ci_migrator_password
          CONTRACTOR_API_PASSWORD: ci_api_password
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_leuret
        run: |
          npm run test:database-tools
          npm run test:invoice-db

      - name: Test API with PostgreSQL and the restricted application role
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_leuret
          PGUSER: contractor_api
          PGPASSWORD: ci_api_password
          PGSSL: disable
        run: npm run test:integration -w apps/api

      - name: Test mobile app
        run: npm run test -w apps/mobile

      - name: Check native app config and Android/iOS bundles
        run: npm run check:native -w apps/mobile

      - name: Build API, Admin Web and Pro Web
        run: |
          npm run build:api
          npm run build:admin
          npm run build:mobile

      - name: Verify test client configuration
        run: |
          grep -R -F "$VITE_API_URL" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_API_URL" apps/mobile/dist > /dev/null
          grep -R -F "$VITE_TURNSTILE_SITE_KEY" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_TURNSTILE_SITE_KEY" apps/mobile/dist > /dev/null

          if grep -R -l -F 'https://api.contractor.com.pa' apps/admin-web/dist apps/mobile/dist; then
            echo "Legacy production API fallback found in client bundles."
            exit 1
          fi

      - name: Test Pro Web sign-in and session in Chrome
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_leuret
          PGUSER: contractor_api
          PGPASSWORD: ci_api_password
        run: npm run test:e2e

      - name: Upload browser test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            e2e-audit/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DATABASE_SSL_CA: ${{ secrets.PRODUCTION_DATABASE_SSL_CA }}
      PRODUCTION_MIGRATOR_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATOR_DATABASE_URL }}
