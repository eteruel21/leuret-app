name: Deploy to Cloudflare

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      PRODUCTION_DATABASE_SSL_CA:
        required: true
      PRODUCTION_MIGRATOR_DATABASE_URL:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    # Base de referencia efímera (misma versión mayor que Supabase) para
    # comparar el esquema de producción con lo que producen las migraciones.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VITE_API_URL: https://api.leurettech.com
      EXPO_PUBLIC_API_URL: https://api.leurettech.com
      VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      VITE_TURNSTILE_CHALLENGE_URL: /turnstile
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL: https://app.leurettech.com/turnstile

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 2. Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: 3. Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 4. Configure production database certificate
        env:
          DATABASE_SSL_CA_PEM: ${{ secrets.PRODUCTION_DATABASE_SSL_CA }}
        run: |
          test -n "$DATABASE_SSL_CA_PEM"
          install -d -m 700 "$RUNNER_TEMP/leuret-database"
          printf '%s\n' "$DATABASE_SSL_CA_PEM" > "$RUNNER_TEMP/leuret-database/supabase-ca.crt"
          chmod 600 "$RUNNER_TEMP/leuret-database/supabase-ca.crt"
          echo "DATABASE_SSL_CA_FILE=$RUNNER_TEMP/leuret-database/supabase-ca.crt" >> "$GITHUB_ENV"

      - name: 5. Block deployment when database migrations drift
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATOR_DATABASE_URL }}
        run: |
          test -n "$MIGRATOR_DATABASE_URL"
          npm run db:check:supabase

      # Detecta cambios hechos a mano en producción (SQL Editor, panel de
      # Supabase) que no están en ninguna migración: compara tablas, columnas,
      # restricciones, índices, políticas RLS, funciones, disparadores y
      # permisos de producción con una base construida desde cero con las
      # migraciones de main. Solo lee el catálogo de producción.
      - name: 5b. Block deployment when production schema drifts from migrations
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DATABASE_NAME: reference_leuret
          CONTRACTOR_MIGRATOR_PASSWORD: reference_migrator_password
          CONTRACTOR_API_PASSWORD: reference_api_password
          PRODUCTION_MIGRATOR_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATOR_DATABASE_URL }}
          REFERENCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reference_leuret
        run: |
          node database/scripts/bootstrap.mjs
          MIGRATOR_DATABASE_URL="$REFERENCE_DATABASE_URL" node database/scripts/migrate.mjs > /dev/null
          MIGRATOR_DATABASE_URL="$PRODUCTION_MIGRATOR_DATABASE_URL" node database/scripts/schema-drift.mjs

      - name: 6. Typecheck all workspaces
        run: npm run typecheck

      - name: 7. Smoke test API Worker runtime
        run: npm run test:worker-runtime -w apps/api

      - name: 8. Build API Backend Worker
        run: npm run build:api

      - name: 9. Build Admin Web Application
        run: npm run build:admin

      - name: 10. Build Mobile User Web Application
        run: npm run build:mobile

      - name: 11. Verify Client API Configuration
        run: |
          test -n "$VITE_API_URL"
          test -n "$EXPO_PUBLIC_API_URL"
          test -n "$VITE_TURNSTILE_SITE_KEY"
          test -n "$EXPO_PUBLIC_TURNSTILE_SITE_KEY"
          test -n "$EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL"
          grep -R -F "$VITE_API_URL" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_API_URL" apps/mobile/dist > /dev/null
          grep -R -F "$VITE_TURNSTILE_SITE_KEY" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_TURNSTILE_SITE_KEY" apps/mobile/dist > /dev/null
          if [ "$VITE_TURNSTILE_SITE_KEY" = "1x00000000000000000000AA" ]; then
            echo "Production Turnstile sitekey must not be a test key."
            exit 1
          fi
          if grep -R -l -F "https://api.contractor.com.pa" apps/admin-web/dist apps/mobile/dist; then
            echo "Legacy production API fallback found in client bundles."
            exit 1
          fi

      - name: Verify the validated commit is still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "A newer commit is already on main. Publish that commit after its validation."
            exit 1
          fi

      - name: 12. Deploy API Worker to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --config apps/api/wrangler.worker.jsonc

      - name: 13. Deploy Admin Web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler pages deploy apps/admin-web/dist --project-name leuret-admin-web --branch main

      - name: 14. Deploy Mobile User Web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler pages deploy apps/mobile/dist --project-name leuret-pro-web --branch main

      - name: Verify deployed API, database and web clients
        run: |
          for url in \
            https://api.leurettech.com/health \
            https://api.leurettech.com/health/database \
            https://admin.leurettech.com/ \
            https://app.leurettech.com/; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 5 \
              --retry-all-errors --max-time 15 --output /dev/null "$url"
          done
